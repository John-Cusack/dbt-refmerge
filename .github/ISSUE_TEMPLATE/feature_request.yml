name: Feature request
description: A new capability, adapter or output format
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should dbt-refmerge do? For new adapters, say which warehouse and dbt adapter version.

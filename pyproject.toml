[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbt-refmerge"
version = "0.1.0"
description = "Safe merge of duplicate direct-import CTEs in dbt SQL models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "sqlglot>=25.0",
  "jinja2>=3.1",
  "typer>=0.9",
  "rich>=13.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "platformdirs>=4.0",
]
authors = [{ name = "dbt-refmerge maintainers" }]

[project.scripts]
dbt-refmerge = "dbt_refmerge.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "ruff>=0.4",
  "mypy>=1.0",
  "types-PyYAML>=6.0",
]
integration = [
  "dbt-postgres>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_refmerge"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C90"]
# UP042: guide pins `class X(str, Enum)` shape; B008: idiomatic Typer defaults.
ignore = ["S101", "C901", "UP042", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "B017"]
"src/dbt_refmerge/dbt_cli.py" = ["S603"]
# comparator/harness are SQL generators; identifiers pass through quote_ident.
"src/dbt_refmerge/verification/comparator.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/dbt_refmerge"]
branch = true

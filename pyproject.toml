[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dbt-refmerge"
dynamic = ["version"]
description = "Safe merge of duplicate direct-import CTEs in dbt SQL models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "John Cusack" }]
keywords = ["dbt", "sql", "cte", "refactoring", "sqlglot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]
# Floors are exercised by the lowest-deps CI job: sqlglot<26.33 lacks the
# exasol/materialize dialects; typer<0.26 fails (or warns) against current click.
dependencies = [
  "sqlglot>=26.33",
  "jinja2>=3.1",
  "typer>=0.26",
  "rich>=13.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/dbt-refmerge"
Issues = "https://github.com/John-Cusack/dbt-refmerge/issues"
Changelog = "https://github.com/John-Cusack/dbt-refmerge/blob/main/CHANGELOG.md"
Funding = "https://buymeacoffee.com/johncusack"

[project.scripts]
dbt-refmerge = "dbt_refmerge.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "ruff>=0.4",
  "mypy>=1.0",
  "types-PyYAML>=6.0",
]
integration = [
  "dbt-postgres>=1.7",
]

[tool.hatch.version]
path = "src/dbt_refmerge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_refmerge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "CHANGELOG.md"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C90"]
# UP042: guide pins `class X(str, Enum)` shape; B008: idiomatic Typer defaults.
ignore = ["S101", "C901", "UP042", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "B017"]
"src/dbt_refmerge/dbt_cli.py" = ["S603"]
# comparator/harness are SQL generators; identifiers pass through quote_ident.
"src/dbt_refmerge/verification/comparator.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/dbt_refmerge"]
branch = true
